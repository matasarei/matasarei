    .n     { fill: #eafdff; font-weight: 600; }
    .out   { font-size: 17px; }
    .sep   { fill: #5b7a82; }
    .dim   { fill: #5b7a82; }
    .caret { fill: #2de2e6; animation: blink 1s steps(1) infinite; }
