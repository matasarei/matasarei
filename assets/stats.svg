<svg xmlns="http://www.w3.org/2000/svg" width="700" height="232" viewBox="0 0 700 232" role="img" aria-label="GitHub stats: 130 stars, 60 forks, 35 watchers, 12 followers, contributed to 17 repos, on GitHub since 2014">
  <style>
    @font-face { font-family: "JBM"; font-weight: 400; src: url(data:font/woff;base64,) format("woff"); }
    @font-face { font-family: "JBM"; font-weight: 600; src: url(data:font/woff;base64,) format("woff"); }
    text { font-family: "JBM", "JetBrains Mono", "Fira Code", ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 15px; fill: #c8f7f9; }
    .bar   { font-size: 11.5px; fill: #5b7a82; letter-spacing: 0.1em; }
