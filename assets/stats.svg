<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 356" role="img" aria-label="I'm a web developer based in Varna, Bulgaria, focusing on building solid solutions for businesses and educational platforms. GitHub stats: 130 stars, 60 forks, 35 watchers, 12 followers, contributed to 17 repos, on GitHub since 2014">
  <style>
