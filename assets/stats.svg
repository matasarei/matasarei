  </style>
  <rect x="0.5" y="0.5" width="699" height="231" fill="#04070d" stroke="#2de2e6" stroke-opacity="0.16"/>
  <line x1="0" y1="34.5" x2="700" y2="34.5" stroke="#2de2e6" stroke-opacity="0.16"/>
  <circle cx="17" cy="17.5" r="4.5" fill="#2de2e6"/>
  <circle cx="32" cy="17.5" r="4.5" fill="#ff2e97"/>
  <circle cx="47" cy="17.5" r="4.5" fill="#eafdff"/>
