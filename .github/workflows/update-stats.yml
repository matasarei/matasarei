name: Update profile stats

on:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recompute badge values
        env:
          # Optional STATS_TOKEN (PAT with repo read access) lets "Contributed to"
          # include private repositories; GITHUB_TOKEN only sees public ones.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: .github/scripts/update-stats.sh "$LOGIN" README.md

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "Stats unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update profile stats"
          git push
